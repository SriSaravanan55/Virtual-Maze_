<!DOCTYPE html>

<html>
<head>
    <title>Student Management System</title>
    <link rel="stylesheet" href="../CSS/dashboard.css">
</head>
<body>
<h1 id="h1">Student Management System</h1>
<div class="dashboard">
    <div id="total-students" class="card">
        <p>Total Students</p>
        <h2 id="total-students-value">0</h2>
    </div>
    <div id="average-mark" class="card">
        <p>Average Mark</p>
        <h2 id="average-mark-value">0</h2>
    </div>
    <div id="highest-mark" class="card">
        <p>Highest Mark</p>
        <h2 id="highest-mark-value">0</h2>
    </div>
    <div id="lowest-mark" class="card">
        <p>Lowest Mark</p>
        <h2 id="lowest-mark-value">0</h2>
    </div>

</div>
<div class="dashboard-buttons">
    <button class="button" id="btn1">
        Student List
    </button>
    <button class="button" id="btn2">
        Search Student
    </button>

    <button class="button" id="btn3">
        Add Student
    </button>

</div>
<script src="../JS/app.js"></script>

</body>
</html>
